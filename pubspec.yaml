name: flutter_bloc_boilerplate
description: "A Flutter Bloc boilerplate project with authentication, themes, and multi-language support."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  shared_preferences: ^2.5.3
  http: ^1.6.0
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  quickalert: ^1.1.0
  flutter_localizations:
    sdk: flutter
  go_router: ^17.2.3
  json_annotation: ^4.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.0
  json_serializable: ^6.13.2
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
